<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf4e8">
<title>BeBe Home｜NEXT STOP</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d0c4}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fbf4e8}
#musicToggle{
  position:fixed;z-index:9999;top:max(10px,env(safe-area-inset-top));left:12px;
  min-width:72px;height:36px;padding:0 12px;border-radius:999px;
  border:1px solid rgba(83,61,44,.14);background:rgba(255,250,242,.92);
  color:#6c513f;font:700 11px/1 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  letter-spacing:.05em;box-shadow:0 8px 20px rgba(60,42,32,.12);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);cursor:pointer;
}
#musicToggle.on{background:rgba(44,66,104,.92);color:#fff;border-color:rgba(255,255,255,.2)}
#musicToggle:active{transform:scale(.97)}
</style>
</head>
<body>
<iframe id="gameFrame" src="game.html" title="BeBe Home NEXT STOP" allow="web-share; clipboard-write"></iframe>
<button id="musicToggle" type="button" aria-label="開啟背景音樂">♪ OFF</button>
<audio id="bgm" src="A_Cradle_for_the_Stars.mp3" loop preload="auto"></audio>
<script>
(()=>{
  const frame=document.getElementById('gameFrame');
  const btn=document.getElementById('musicToggle');
  const bgm=document.getElementById('bgm');
  let enabled=false, raf=0, target=.24;

  bgm.volume=0;

  function fadeTo(v,ms=500){
    cancelAnimationFrame(raf);
    const from=bgm.volume, start=performance.now();
    function step(now){
      const t=Math.min(1,(now-start)/ms);
      bgm.volume=from+(v-from)*(1-Math.pow(1-t,3));
      if(t<1) raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
  }

  async function toggle(){
    enabled=!enabled;
    if(enabled){
      try{
        await bgm.play();
        fadeTo(target,650);
        btn.textContent='♪ ON';
        btn.classList.add('on');
        btn.setAttribute('aria-label','關閉背景音樂');
      }catch(e){
        enabled=false;
      }
    }else{
      fadeTo(0,350);
      setTimeout(()=>{ if(!enabled) bgm.pause(); },380);
      btn.textContent='♪ OFF';
      btn.classList.remove('on');
      btn.setAttribute('aria-label','開啟背景音樂');
    }
  }
  btn.addEventListener('click',toggle);

  function watchGame(){
    try{
      const doc=frame.contentDocument;
      if(!doc) return;
      const update=()=>{
        if(!enabled) return;
        const reveal=doc.querySelector('[data-screen="reveal"].active');
        fadeTo(reveal?.classList.contains('active') ? .10 : target, reveal ? 220 : 520);
      };
      const mo=new MutationObserver(update);
      doc.querySelectorAll('.screen').forEach(el=>mo.observe(el,{attributes:true,attributeFilter:['class']}));
      doc.addEventListener('click',()=>{ if(enabled && bgm.paused) bgm.play().catch(()=>{}); },{passive:true});
      update();
    }catch(e){}
  }
  frame.addEventListener('load',watchGame);
})();
</script>
</body>
</html>
